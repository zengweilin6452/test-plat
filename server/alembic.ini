# TestDock Alembic configuration.
#
# The database URL is NOT hardcoded here. alembic/env.py resolves it in order:
#   1. env var TESTDOCK_DATABASE_URL
#   2. server/app/config.py Settings.database_url
#   3. sqlalchemy.url below (local development default)
# This keeps the CLI path (alembic upgrade head) and the container/CI path identical.
#
# NOTE: keep this file pure ASCII on purpose. Alembic reads it with
# configparser, whose read() defaults to encoding="locale"; on a GBK-codepage
# Windows console non-ASCII comments raise UnicodeDecodeError: 'gbk' codec
# can't decode byte 0x82. English comments avoid the whole class of failures.

[alembic]
# Migration script directory (relative to this file)
script_location = alembic

# Version file naming: 0001_initial.py / 0002_xxx.py -- prefix order is the revision order
file_template = %%(rev)s_%%(slug)s

# Sequential numeric revision ids instead of random hashes, so 0001/0002 stay
# human-comparable. Migrations are hand-written (no autogenerate), so no random id is needed.
truncate_slug_length = 40

# Timezone: always UTC (matches the timestamptz comments in docs/platform-prototype/schema.sql)
timezone = UTC

# Progress output interval (seconds) for long runs; creating the 24 tables can take a while
output_encoding = utf-8

# Used only when env.py finds no URL from TESTDOCK_DATABASE_URL / app.config.
# Aligned with app/config.py: EDB portable PG17.6, port 55432, user testdock
# (password-less trust auth, loopback only).
sqlalchemy.url = postgresql+psycopg://testdock@127.0.0.1:55432/testdock

# ---------------------------------------------------------------------------
# Logging configuration required by logging.config.fileConfig() in env.py
# ---------------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
