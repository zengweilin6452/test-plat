[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "testdock-server"
version = "0.1.0"
description = "TestDock 移动测试平台后端：任务编排、设备租约、运行生命周期、证据与三态门禁"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.scripts]
testdock-api = "app.main:main"

[tool.hatch.build.targets.wheel]
packages = ["app", "testdock_runner"]

[tool.pytest.ini_options]
markers = [
    "integration: needs a real PostgreSQL (alembic upgrade head applied)",
]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["app", "testdock_runner", "tests"]
# 历史迁移（长 SQL）与测试夹具（pytest 注入 / 同模块覆盖 fixture）不纳入强制 lint。
extend-exclude = ["alembic/versions", "alembic/_gen", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    # FastAPI `Depends()` 默认参数写法，项目统一使用。
    "B008",
    # 短字符串拼接沿用 %-format（存量风格），不作为缺陷扩散检查。
    "UP031",
]

[tool.ruff.lint.per-file-ignores]
# alembic/env.py 先改 sys.path 再 import app，E402 是刻意顺序。
"alembic/env.py" = ["E402"]
