[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "testdock-server"
version = "0.1.0"
description = "TestDock 移动测试平台后端：任务编排、设备租约、运行生命周期、证据与三态门禁"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.scripts]
testdock-api = "app.main:main"

[tool.hatch.build.targets.wheel]
packages = ["app", "testdock_runner"]

[tool.pytest.ini_options]
markers = [
    "integration: needs a real PostgreSQL (alembic upgrade head applied)",
]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "testdock_runner", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
