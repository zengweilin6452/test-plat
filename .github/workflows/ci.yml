name: CI

# 关键：vendor 回归与平台测试必须在【宿主等价环境】跑。
# DSH 沙箱里 pytest 的 mkdir(mode=0o700) 与 pip 的临时文件都会被拒（WinError 5/13），
# 所以 CI 是 P0 验收的唯一可靠执行点（docs/plan/development-plan.md §12.1）。

on:
  push:
    branches: [master, main]
  pull_request:

# Windows runner 的 stdout 默认是 charmap 编码，校验脚本/测试打印中文横幅会
# UnicodeEncodeError（2026-11-08 master CI 实证）；统一按 UTF-8 走管道。
env:
  PYTHONIOENCODING: utf-8

jobs:
  vendor:
    name: vendor 只读校验 + 回归
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: vendor 只读校验（sha256 逐字节）
        # 必须 bash：默认 pwsh 对 run 块是逐条点源执行，退出码取最后一条，
        # check 失败会被第二条命令的 0 吞掉（2026-11-14 CI 实测被掩盖）。
        shell: bash
        run: |
          python scripts/vendor_sync.py check
          python scripts/test_vendor_sync_check.py
      - name: 安装 vendor（可编辑）
        run: |
          python -m pip install --upgrade pip
          # 单测 conftest 导入 cv2（[image] extra）与 fastapi.testclient/uvicorn
          # （[viewer] extra）；缺装会在收集期 ModuleNotFoundError，此前被编码
          # 失败掩盖（2026-11-14 CI 实测）。
          python -m pip install -e "./vendor/mobile_auto[image,viewer]" -e ./vendor/mobile_perf
          python -m pip install pytest pytest-asyncio httpx
      # 走 scripts/run_vendor_tests.sh：它负责 PYTHONPATH（tests 包跨模块导入）
      # 与 basetemp 收敛；MOBILE_PKG 拆两步保住作业内失败定位。
      - name: mobile_auto unit + contract
        shell: bash
        run: MOBILE_PKG=auto bash scripts/run_vendor_tests.sh
      - name: mobile_perf unit + contract
        shell: bash
        run: MOBILE_PKG=perf bash scripts/run_vendor_tests.sh

  server:
    name: 后端测试（Windows + 便携 PostgreSQL）
    runs-on: windows-latest
    # GitHub 的服务容器只能跑在 Linux runner 上；Windows 测试环境沿用仓库
    # 自带的便携 PostgreSQL（scripts/pg_portable_setup.ps1），conftest 也认这个路径。
    env:
      PYTHONPATH: ${{ github.workspace }}/vendor/mobile_auto/src;${{ github.workspace }}/vendor/mobile_perf/src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 缓存便携 PostgreSQL 二进制
        uses: actions/cache@v4
        with:
          path: .runtime/pg17/pgsql
          key: pg17-17.6-1-${{ runner.os }}
      - name: 安装后端依赖
        working-directory: server
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          # runner 模板库链路经 vendor imaging（engine.py 顶层导入 cv2）；
          # 缺装会让模板库测试 ModuleNotFoundError（2026-11-14 全量预演实测）。
          python -m pip install opencv-python-headless numpy
      - name: 静态检查（ruff：app/ 与 runner_pkg/）
        working-directory: server
        run: python -m ruff check .
      - name: 准备便携 PostgreSQL
        shell: pwsh
        run: ./scripts/pg_portable_setup.ps1 init
      - name: 契约测试（无需数据库，失败即阻断）
        working-directory: server
        run: >-
          python -m pytest
          tests/test_contract_openapi.py
          tests/test_error_contract.py
          tests/test_migration_append_only.py
          -q
      - name: 后端测试（含 PostgreSQL 用例）
        working-directory: server
        shell: pwsh
        env:
          # 测试只读 TESTDOCK_TEST_DATABASE_URL；alembic 与运行期设置读
          # TESTDOCK_DATABASE_URL，两者指向同一个专用测试库。
          TESTDOCK_TEST_DATABASE_URL: postgresql+psycopg://testdock@127.0.0.1:55432/testdock
          TESTDOCK_DATABASE_URL: postgresql+psycopg://testdock@127.0.0.1:55432/testdock
        run: |
          ../scripts/pg_portable_setup.ps1 start
          try {
            python -m alembic upgrade head
            if ($LASTEXITCODE -ne 0) { throw "alembic upgrade 失败" }
            python -m pytest -o addopts="" --junitxml=junit.xml -q
            if ($LASTEXITCODE -ne 0) { throw "后端测试失败（退出码 $LASTEXITCODE）" }
          } finally {
            ../scripts/pg_portable_setup.ps1 stop
          }
      - name: 核对数据库用例确实执行（不是全量 skip）
        working-directory: server
        shell: pwsh
        run: |
          @'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse("junit.xml").getroot()
          cases = list(root.iter("testcase"))
          skipped = [case for case in cases if case.find("skipped") is not None]
          db_skips = []
          for case in skipped:
              message = case.find("skipped").get("message") or ""
              if "TESTDOCK_TEST_DATABASE_URL" in message or "测试数据库不可用" in message:
                  db_skips.append(case.get("name"))
          if db_skips:
              sys.exit(f"数据库测试被跳过 {len(db_skips)} 个，CI 未接通测试连接")
          if len(cases) < 550:
              sys.exit(f"只执行了 {len(cases)} 个用例，低于后端基线 577")
          print(f"执行 {len(cases)} 个用例，跳过 {len(skipped)} 个（无数据库跳过）")
          '@ | python -
      - name: 部署隔离行为测试（无需数据库）
        run: python scripts/test_deployment_isolation.py

  web:
    name: 前端构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 安装依赖、契约测试与构建
        working-directory: web
        run: |
          npm ci || npm install
          npm run typecheck
          npm test
          npm run build
